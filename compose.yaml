name: codyssey-b4-1

services:
  agent:
    build: .
    image: codyssey-b4-1:local
    platform: linux/arm64

    # UFW requires NET_ADMIN; startup runs SSH and cron only.
    cap_add: [NET_ADMIN]
    command: ["/bin/bash", "/workspace/start.sh"]

    ports:
      - "127.0.0.1:20022:20022"
      - "127.0.0.1:15034:15034"

    volumes:
      # Keep source read-only and preserve app data, logs, and evidence.
      - .:/workspace:ro
      - app_data:/home/agent-admin/agent-app
      - app_logs:/var/log/agent-app
      - evidence:/var/lib/agent-evidence

volumes:
  app_data:
  app_logs:
  evidence:
